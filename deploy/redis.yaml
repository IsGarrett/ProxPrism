apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
          - name: redis
            image: redis:6.0.20
            ports: 
              - containerPort: 6379
            args: ["--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
            resources:
              requests:
                memory: "64Mi"
                cpu: "50m"
              limits:
                memory: "256Mi"
            readinessProbe:
              exec:
                command: ["redis-cli", "ping"]
              initialDelaySeconds: 3
              periodSeconds: 5
--- 
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379